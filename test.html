<!DOCTYPE html>
<html>
<head>
    <title>IoT System Test</title>
    <style>
        body { background: #0a0f1f; color: white; font-family: monospace; padding: 50px; }
        .success { color: #00ff9d; }
        .error { color: #ff4444; }
        .test-card {
            background: #151f2f;
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 20px;
            margin: 10px 0;
        }
        .btn {
            background: #00ffff;
            color: black;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <h1>🔧 IoT System Test Page</h1>
    
    <div class="test-card">
        <h2>1. Database Test</h2>
        <p id="dbTest">Checking...</p>
    </div>
    
    <div class="test-card">
        <h2>2. Environment Info</h2>
        <p>Runtime: <span id="runtimeInfo">—</span></p>
    </div>
    
    <div class="test-card">
        <h2>3. Button Test</h2>
        <button class="btn" onclick="testClick()">Click Me</button>
        <p id="clickTest">Not clicked yet</p>
    </div>
    
    <div class="test-card">
        <h2>4. AJAX Test (Simulated)</h2>
        <button class="btn" onclick="testAjax()">Test AJAX</button>
        <p id="ajaxTest">Not tested</p>
    </div>
    
    <div class="test-card">
        <h2>5. Quick Setup</h2>
        <a href="setup.php" class="btn">Run Full Setup</a>
    </div>
    
    <script>
    /**
     * Test page — replaces PHP/MySQL checks with browser/localStorage equivalents.
     */

    const DB_NAME = 'iot_smart_home';

    /* -------- 1. Database Test (localStorage simulation) -------- */
    (function databaseTest() {
        const el = document.getElementById('dbTest');
        try {
            // Test 1: Can we access localStorage?
            localStorage.setItem('test_iot', '1');
            el.innerHTML += "<p class='success'>✅ localStorage accessible</p>";

            // Test 2: Can we create/remove a "database" (key)?
            localStorage.setItem('test_iot_db', JSON.stringify({ ok: true }));
            el.innerHTML += "<p class='success'>✅ Can create databases</p>";
            localStorage.removeItem('test_iot_db');
            localStorage.removeItem('test_iot');

            // Test 3: Can we write the main DB key?
            const probe = { id: 0, name: 'probe' };
            localStorage.setItem(DB_NAME + '_probe', JSON.stringify(probe));
            const readBack = JSON.parse(localStorage.getItem(DB_NAME + '_probe'));
            localStorage.removeItem(DB_NAME + '_probe');

            if (readBack && readBack.name === 'probe') {
                el.innerHTML += "<p class='success'>✅ Read/write/delete working</p>";
            } else {
                el.innerHTML += "<p class='error'>❌ Data round-trip failed</p>";
            }
        } catch (e) {
            el.innerHTML = "<p class='error'>❌ localStorage Error: " + e.message + "</p>";
        }
    })();

    /* -------- 2. Environment Info (replaces phpversion) -------- */
    (function environmentInfo() {
        const el = document.getElementById('runtimeInfo');
        const ua = navigator.userAgent;
        let browser = 'Unknown';

        if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Chrome';
        else if (ua.includes('Edg')) browser = 'Edge';
        else if (ua.includes('Firefox')) browser = 'Firefox';
        else if (ua.includes('Safari')) browser = 'Safari';

        el.textContent = `${browser} • ${navigator.platform} • Screen ${screen.width}×${screen.height}`;
    })();

    /* -------- 3. Button Test (unchanged) -------- */
    function testClick() {
        const el = document.getElementById('clickTest');
        el.innerHTML = '✅ Button clicked!';
        el.style.color = '#00ff9d';
    }

    /* -------- 4. AJAX Test (simulated device toggle) -------- */
    function testAjax() {
        const el = document.getElementById('ajaxTest');

        // Simulate the toggle_device.php endpoint without a network round-trip.
        // This matches the same contract: device_id=1&status=1 → JSON response.
        try {
            const devicesKey = DB_NAME + '_devices';
            const raw = localStorage.getItem(devicesKey);
            let devices = raw ? JSON.parse(raw) : [];

            // If setup hasn't been run yet, seed a minimal device so the test works.
            if (devices.length === 0) {
                devices = [{ id: 1, device_name: 'Test Device', device_type: 'light', status: 0, value: 0, room: 'Test', ip_address: '192.168.1.1', mac_address: 'AA:BB:CC:DD:EE:00', last_seen: new Date().toISOString() }];
            }

            const deviceId = 1;
            const newStatus = 1;
            const device = devices.find(d => d.id === deviceId);

            if (!device) {
                el.innerHTML = "❌ AJAX error: Device " + deviceId + " not found";
                el.style.color = '#ff4444';
                return;
            }

            device.status = newStatus;
            device.last_seen = new Date().toISOString();
            localStorage.setItem(devicesKey, JSON.stringify(devices));

            // Mimic the JSON response shape from a real toggle_device.php
            const responseData = {
                success: true,
                device_id: deviceId,
                status: newStatus,
                device_name: device.device_name
            };

            el.innerHTML = '✅ AJAX working: ' + JSON.stringify(responseData);
            el.style.color = '#00ff9d';

        } catch (error) {
            el.innerHTML = '❌ AJAX error: ' + error.message;
            el.style.color = '#ff4444';
        }
    }
    </script>
</body>
</html>
